# Used with `install.sh tunnel`. Cloudflare Tunnel connects out from this
# machine to Cloudflare, which serves Stash's domain and handles HTTPS, so
# no web server, open port or VPS is needed in front of Stash. The tunnel's
# public hostname points at http://caddy:80 in the Cloudflare dashboard.
services:
  cloudflared:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: cloudflare/cloudflared:2026.7.3
    container_name: reader-tunnel
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - caddy
