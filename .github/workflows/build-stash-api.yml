name: Build Stash API image

# Builds Stash's API and publishes it to GitHub's container registry. The
# same image runs the queue processor (deploy/docker-compose.yml sets its
# command).

on:
  push:
    branches:
      - main
    paths:
      - 'packages/api/**'
      - 'packages/readabilityjs/**'
      - 'packages/text-to-speech/**'
      - 'packages/content-handler/**'
      - 'packages/liqe/**'
      - 'packages/utils/**'
      - 'package.json'
      - 'yarn.lock'
      - '.dockerignore'
      - '.github/workflows/build-stash-api.yml'
  pull_request:
    paths:
      - 'packages/api/**'
      - 'packages/readabilityjs/**'
      - 'packages/text-to-speech/**'
      - 'packages/content-handler/**'
      - 'packages/liqe/**'
      - 'packages/utils/**'
      - 'package.json'
      - 'yarn.lock'
      - '.dockerignore'
      - '.github/workflows/build-stash-api.yml'
  workflow_dispatch:

jobs:
  build-api:
    name: Build and push API image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The monorepo install fills the default runner disk, so clear out
      # preinstalled toolchains the build doesn't use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stash-api" >> "$GITHUB_ENV"

      - name: Log in to GitHub container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/api/Dockerfile
          platforms: linux/amd64
          # Pull requests only check that the image builds.
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api
