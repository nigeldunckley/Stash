name: Build Stash web image

# Builds the restyled web app and publishes it to GitHub's container
# registry. The rest of the stack keeps using the upstream Omnivore images.

on:
  push:
    branches:
      - main
    paths:
      - 'packages/web/**'
      - '.github/workflows/build-stash-web.yml'
  workflow_dispatch:

jobs:
  build-web:
    name: Build and push web image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stash-web" >> "$GITHUB_ENV"

      - name: Log in to GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/web/Dockerfile-self
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
