<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Stash settings</title>
  <style>
    :root {
      --bg: #FAFAFA; --card: #FFFFFF; --ink: #09090B; --muted: #71717A;
      --border: #E4E4E7; --accent: #FF4F00; --field: #FFFFFF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111113; --card: #18181B; --ink: #FAFAFA; --muted: #A1A1AA;
        --border: #27272A; --field: #111113;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
      font: 400 14px/1.5 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; justify-content: center; align-items: flex-start; padding: 64px 16px;
    }
    .card {
      width: 100%; max-width: 480px; background: var(--card);
      border: 1px solid var(--border); border-radius: 14px; padding: 32px;
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .brand span { font-weight: 600; font-size: 19px; letter-spacing: -0.02em; }
    .eyebrow {
      font: 500 12px ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0;
    }
    h1 { font-size: 28px; line-height: 1.1; letter-spacing: -0.03em; font-weight: 600; margin: 6px 0 24px; }
    label { display: block; font-weight: 500; margin: 0 0 6px; }
    .hint { color: var(--muted); font-size: 13px; margin: 6px 0 20px; }
    .hint a { color: var(--accent); }
    input {
      width: 100%; height: 40px; padding: 0 12px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--field); color: var(--ink);
      font: 400 14px ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, monospace;
    }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255, 79, 0, 0.18); }
    .row { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
    button {
      height: 40px; padding: 0 18px; border: 0; border-radius: 8px; cursor: pointer;
      background: var(--ink); color: var(--bg); font-weight: 500; font-size: 14px; font-family: inherit;
    }
    button:hover { opacity: 0.85; }
    #status { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
        <rect width="24" height="24" rx="7" fill="#FF4F00"/>
        <path d="M8 6.5h8v11.5l-4-2.7-4 2.7z" fill="#09090B"/>
      </svg>
      <span>Stash</span>
    </div>
    <p class="eyebrow">Extension settings</p>
    <h1>Connect to your Stash.</h1>

    <label for="server-url">Server address</label>
    <input type="url" id="server-url" placeholder="https://stash.nigeldunckley.com" spellcheck="false">
    <p class="hint">Where your Stash is hosted. Leave blank to use stash.nigeldunckley.com.</p>

    <label for="api-key">API key</label>
    <input type="password" id="api-key" placeholder="Paste your API key" spellcheck="false">
    <p class="hint">Create one in Stash under Settings, then API keys. <a id="api-link" href="#" target="_blank">Open API keys</a></p>

    <div class="row">
      <button id="save-btn">Save settings</button>
      <span id="status" role="status"></span>
    </div>
  </main>
  <script src="options.js"></script>
</body>
</html>
